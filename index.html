<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Brain training inspired by Gameloft's Brain Challenge: ten games across logic, math, memory, visual and focus.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brain Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one chunky app column on a bright dotted sky; each area paints the board in its own colour. Single bright theme by design. */
:root{
  --bg:#EAF5FF; --dots:#CFE6FB; --card:#FFFFFF; --ink:#1B1B3A; --muted:#565C80; --soft:#F2F5FB;
  --logic:#7C5CFF; --math:#FF7A1A; --memory:#0FB3A2; --visual:#FF4F8B; --focus:#FFBE0B;
  --logic-soft:#EFEAFF; --math-soft:#FFF0E2; --memory-soft:#E0F7F3; --visual-soft:#FFE6EF; --focus-soft:#FFF6D6;
  --good:#22C55E; --bad:#EF4444; --water:#2EA8FF;
  --cat:#7C5CFF; --cat-soft:#EFEAFF; --on-cat:#FFFFFF;
  --f-display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1;text-wrap:balance}
p{margin:0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink)}
.btn{border:3px solid var(--ink);border-radius:16px;padding:12px 20px;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--cat);color:var(--on-cat);box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1 1 150px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--cat);color:var(--on-cat);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;align-self:flex-start}
.screen{display:flex;flex-direction:column;gap:22px}
.icon-btn{border:3px solid var(--ink);background:var(--card);border-radius:14px;width:46px;height:46px;font-size:20px;box-shadow:0 4px 0 var(--ink);flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* mascot */
.mascot{display:block;overflow:visible}
.m-body{fill:#FF9EC4;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.m-fold{fill:none;stroke:#E0609A;stroke-width:2.5;stroke-linecap:round}
.m-white{fill:#fff;stroke:var(--ink);stroke-width:2}
.m-pupil{fill:var(--ink)}
.m-mouth{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.m-cheek{fill:#FF5C9D;opacity:.45}
.happy .mascot{animation:hop .45s}
.sad .mascot{animation:wobble .45s}
@keyframes hop{40%{transform:translateY(-8px) scale(1.06)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* home */
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top .mascot{width:92px;height:84px;flex:none}
.logo{font-size:clamp(50px,14vw,82px);font-weight:800;letter-spacing:-.01em;line-height:.85}
.logo span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.logo .w{display:block;white-space:nowrap}
.hero .sound{position:absolute;top:14px;right:14px}
.lede{color:var(--muted);max-width:46ch;font-size:16px}
.modes{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.mode{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode strong{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.05}
.mode small{font-size:14px;line-height:1.35}
.mode.main{background:var(--logic);color:#fff}
.mode.stress{background:var(--focus)}
@media (max-width:440px){.modes{grid-template-columns:1fr}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:6px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.chart{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--logic);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--logic-soft)}
.chart .gl{stroke:#D5DBEA;stroke-dasharray:3 5}
.chart .pt{fill:var(--logic);stroke:var(--ink);stroke-width:2}
.chart .lb{fill:var(--muted);font:700 10px var(--f-body)}
.label{font-family:var(--f-display);font-weight:800;font-size:22px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{border:3px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--ink);padding:12px;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;transition:transform .07s,box-shadow .07s}
.gcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.gcard .ic{width:52px;height:52px;border-radius:14px;background:var(--cat-soft);border:2px solid var(--ink);display:grid;place-items:center;font-size:28px}
.gcard .t{min-width:0;display:flex;flex-direction:column}
.gcard strong{font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.1}
.gcard small{color:var(--muted);font-size:13px;line-height:1.3}
.gcard .best{font-size:12px;color:var(--cat);font-weight:800;filter:brightness(.8)}
@media (max-width:420px){.tgrid{grid-template-columns:1fr}}

/* intro / result / final panels */
.panel{padding:24px 20px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.panel .big-ic{width:84px;height:84px;border-radius:22px;background:var(--cat-soft);border:3px solid var(--ink);display:grid;place-items:center;font-size:48px;box-shadow:0 4px 0 var(--ink)}
.panel h2{font-size:clamp(36px,10vw,52px);font-weight:800}
.how{color:var(--muted);font-size:17px;max-width:50ch}
.meta{color:var(--muted)}
.seg{display:flex;background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cat);color:var(--on-cat)}
.stars{display:flex;gap:6px;font-size:48px;line-height:1}
.stars span{display:inline-block;animation:starpop .45s backwards}
.stars span.off{filter:grayscale(1);opacity:.25}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.pts{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,20vw,96px);line-height:.9;color:var(--cat);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.pts small{font-size:.3em;-webkit-text-stroke:0;text-shadow:none;color:var(--muted)}
.newbest{align-self:flex-start;background:var(--focus);border:2px solid var(--ink);font-family:var(--f-display);font-weight:800;border-radius:999px;padding:2px 12px;animation:starpop .5s .3s backwards}

/* play */
.hud{padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hud .mascot{width:58px;height:52px}
.hud h2{font-size:24px;font-weight:800;margin-top:2px}
.scorebox{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.score{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.score.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}
.combo{font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--focus);border:2px solid var(--ink);border-radius:999px;padding:0 8px;visibility:hidden}
.combo.on{visibility:visible;animation:bump .25s}
.lvl{font-size:12px;color:var(--muted);font-weight:800}
.timer{display:flex;align-items:center;gap:10px}
.track{flex:1;height:16px;border-radius:9px;background:var(--card);border:3px solid var(--ink);overflow:hidden}
.fill{height:100%;width:100%;background:var(--cat);transform-origin:left}
.timer .secs{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:3ch;text-align:right}
.timer.hurry .fill{background:var(--bad);animation:pulse .5s infinite alternate}
.timer.hurry .secs{color:var(--bad)}
@keyframes pulse{to{opacity:.55}}
.wrap{position:relative}
.wrap.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.stage{background:var(--cat-soft);min-height:460px;padding:16px 14px;display:flex;flex-direction:column;justify-content:center;gap:14px;transition:background-color .15s;position:relative;overflow:hidden}
.wrap.ok .stage{background:#DFF8E7}
.wrap.no .stage{background:#FFE1E1}
.count{font-family:var(--f-display);font-weight:800;font-size:120px;text-align:center;color:var(--cat);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:pop .5s}
@keyframes pop{from{transform:scale(1.6);opacity:.2}}
.toast{position:absolute;top:12px;left:50%;z-index:8;background:var(--ink);color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px;padding:4px 18px;border-radius:999px;white-space:nowrap;animation:toast 1.4s forwards;pointer-events:none}
@keyframes toast{0%{transform:translate(-50%,-10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.08);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.quit{background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;padding:4px 0;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}
.hint{text-align:center;color:var(--muted);font-weight:700;text-wrap:balance}
.hint b{color:var(--ink)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pt{position:fixed;width:10px;height:10px;border-radius:3px;margin:-5px 0 0 -5px;border:1.5px solid var(--ink);animation:pt .65s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.float{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:26px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:fl .9s ease-out forwards;white-space:nowrap}
.float.bad{color:var(--bad)}
.float.small{font-size:18px}
@keyframes fl{0%{transform:translate(-50%,-30%) scale(.6)}20%{transform:translate(-50%,-60%) scale(1.15)}100%{transform:translate(-50%,-170%) scale(1);opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:15px;border:1.5px solid var(--ink);border-radius:2px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--sx),110vh) rotate(var(--r))}}

/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 6px;font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;transition:transform .07s,box-shadow .07s}
.choice:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice kbd{position:absolute;top:2px;left:7px;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.choice.is-ok{background:var(--good)}
.choice.is-bad{background:var(--bad)}
.emo{font-size:40px;line-height:1}

/* pipe flow */
.pipes{display:grid;gap:4px;width:100%;max-width:420px;margin:0 auto;align-items:center}
.pipe{aspect-ratio:1;max-width:100%;border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:0;overflow:hidden}
.pipe svg{width:100%;height:100%;display:block;transition:transform .16s ease-out}
.pipe .p{fill:#B3BBD2}
.pipe.wet .p{fill:var(--water)}
.pipe.wet{background:#E8F6FF}
.endcap{font-size:26px;text-align:center;line-height:1}
.endcap.bloom{animation:bump .5s 2}

/* fruit scales */
.scales{display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center}
.scales svg{width:200px;max-width:49%;height:auto}
.sc-beam{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.sc-str{stroke:var(--ink);stroke-width:1.5}
.sc-pan{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.sc-post{fill:#8C93B0;stroke:var(--ink);stroke-width:2}
.sc-piv{fill:var(--focus);stroke:var(--ink);stroke-width:2}
.beam{transform-origin:100px 40px}
.beam,.panL,.panR{transition:transform .9s cubic-bezier(.3,1.7,.5,1)}
.tilted .beam{transform:rotate(var(--a))}
.tilted .panL,.tilted .panR{transform:translateY(var(--dy))}

/* bubble sum */
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sumbar span{font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:2px 12px}
.sumbar b{font-size:30px;margin-left:4px}
.sumbar .tg{color:var(--math)}
.arena{position:relative;height:350px;border-radius:18px;background:linear-gradient(#A8DBFF,#E6F5FF);overflow:hidden;border:3px solid var(--ink);touch-action:manipulation}
.bubble{position:absolute;left:0;top:0;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 32% 30%,#fff 0 11%,#BDE6FF 12% 100%);font-family:var(--f-display);font-weight:800;font-size:24px;display:grid;place-items:center;color:var(--ink);padding:0;will-change:transform}
.bubble.picked{background:radial-gradient(circle at 32% 30%,#fff 0 11%,var(--math) 12% 100%);color:#fff;-webkit-text-stroke:1px var(--ink)}

/* shop till */
.counter{display:flex;align-items:center;gap:12px}
.face{font-size:64px;line-height:1;animation:slidein .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes slidein{from{transform:translateX(-80px);opacity:0}}
.speech{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-weight:800}
.speech::before{content:"";position:absolute;left:-11px;top:50%;width:16px;height:16px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.items{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;font-size:38px;line-height:1.1}
.item small{font-family:var(--f-display);font-weight:800;font-size:16px;background:var(--focus);border:2px solid var(--ink);border-radius:8px;padding:0 6px;margin-top:4px}
.till{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:17px}
.till b{color:#7CFFB2;font-size:22px}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.note{border:2.5px solid var(--ink);border-radius:10px;padding:10px 2px;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.note:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.note.clr{background:#fff}

/* burger bar */
.ticket{background:#FFFBEA;border:3px dashed var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stack{display:flex;flex-direction:column;align-items:center}
.stack span{font-size:48px;line-height:1;margin-bottom:-22px;position:relative}
.stack span:last-child{margin-bottom:0}
.stack span.drop{animation:drop .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}}
.stack.topple{animation:topple .7s forwards}
@keyframes topple{to{transform:rotate(28deg) translate(50px,20px);opacity:.25}}
.memo{width:100%;height:12px;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.memo i{display:block;height:100%;background:var(--cat);animation:memo linear forwards}
@keyframes memo{from{width:100%}to{width:0}}
.plate{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative;padding-bottom:16px}
.plate::after{content:"";position:absolute;bottom:0;width:190px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.plate .stack{position:relative;z-index:1}
.pantry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ing{font-size:34px;line-height:1;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 0;box-shadow:0 4px 0 var(--ink)}
.ing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* speed match */
.cardzone{height:210px;display:grid;place-items:center}
.mcard{width:150px;height:186px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:92px;line-height:1;animation:cardin .22s ease-out}
@keyframes cardin{from{transform:translateX(70px) rotate(10deg);opacity:0}}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .btn{font-size:24px;padding:16px}
.yn .no{background:var(--bad);color:#fff}
.yn .yes{background:var(--good);color:#fff}

/* shadow snap */
.silbox{height:190px;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px}
.sil{font-size:132px;line-height:1;filter:brightness(0);user-select:none;display:inline-block}

/* shelf swap */
.shelf{display:grid;gap:8px;background:#C98A4B;border:3px solid var(--ink);border-radius:16px;padding:10px;position:relative}
.slot2{background:#F6E1BF;border:2px solid #8A5A2B;border-radius:10px;font-size:40px;line-height:1;aspect-ratio:1.15;max-width:100%;padding:0}
.slot2:not(:disabled):active{transform:scale(.94)}
.slot2.ring{background:var(--good);border-color:var(--ink)}
.slot2.is-bad{background:var(--bad);border-color:var(--ink)}
.shelf .dark{position:absolute;inset:0;background:#0B0B1E;border-radius:13px;opacity:0;transition:opacity .2s;pointer-events:none;display:grid;place-items:center;font-size:44px}
.shelf.off .dark{opacity:.97}

/* whack-a-rule */
.rule{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#fff;border-radius:16px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:21px;min-height:56px}
.rule .e{font-size:34px;line-height:1}
.rule.flash{animation:rflash .7s}
@keyframes rflash{0%,50%{background:var(--bad);transform:scale(1.06)}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#8BD46A;border:3px solid var(--ink);border-radius:18px;padding:10px}
.hole{position:relative;aspect-ratio:1;max-width:100%;border:0;background:transparent;padding:0;touch-action:manipulation}
.pit{position:absolute;left:8%;right:8%;bottom:8%;height:30%;background:#4A2E14;border:3px solid var(--ink);border-radius:50%}
.mask{position:absolute;left:0;right:0;top:0;bottom:22%;overflow:hidden}
.critter{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-size:clamp(42px,12vw,62px);line-height:1;transform:translateY(110%);transition:transform .13s ease-out}
.hole.up .critter{transform:translateY(0)}
.hole.bonk .critter{transform:translateY(30%) scaleY(.6)}

/* bus stop */
.onboard{font-family:var(--f-display);font-weight:800;font-size:60px;text-align:center;line-height:1;color:var(--focus);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.bscene{position:relative;height:190px;background:linear-gradient(#A8DBFF 0 68%,#6E7488 68% 100%);border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.bscene::after{content:"";position:absolute;left:0;right:0;bottom:12%;height:5px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 40px)}
.bus{position:absolute;bottom:22%;left:0;font-size:96px;line-height:1;z-index:2}
.stopsign{position:absolute;bottom:30%;left:4%;font-size:48px;line-height:1}
.pax{position:absolute;bottom:28%;left:0;font-size:38px;line-height:1;z-index:3}

.bugs{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;border-radius:22px}
.bug{position:absolute;left:0;top:0;font-size:30px;line-height:1}

/* final */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center}
.bar span{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.1}
.bar small{display:block;color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:700}
.bar .track{height:18px}
.bar b{font-family:var(--f-display);font-size:20px;text-align:right}
.verdict{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.coach{background:var(--soft);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center}
.coach .mascot{width:60px;height:54px}
.coach p+p{margin-top:4px}

  function place(b) { b.el.style.transform = `translate(${b.x + (b.picked ? 0 : Math.sin(b.ph) * 7)}px,${b.y}px)${b.picked ? ' scale(1.12)' : ''}`; }
  function spawn(y) {
    const c = cfg(), need = target - sum;
    const v = need > 0 && need <= c.m && Math.random() < .4 ? need : rand(1, Math.min(c.m, Math.max(2, target - 1)));
    const el = document.createElement('button');

    else { b.picked = true; b.el.classList.add('picked'); sum += b.v; SFX.pop(); }

    if (sum === target) {

/* ============ MEMORY: Burger Bar ============ */
const ING = [['🥬', 'Lettuce'], ['🍅', 'Tomato'], ['🧀', 'Cheese'], ['🥩', 'Patty'], ['🥓', 'Bacon'], ['🧅', 'Onion'], ['🥒', 'Pickle'], ['🍳', 'Egg']];
function burgerGame(stage, api) {
  let order, built, phase;
  const stackHTML = (list, top) => `<div class="stack">${top ? '<span>🍞</span>' : ''}${[...list].reverse().map(i => `<span>${ING[i][0]}</span>`).join('')}<span>🍞</span></div>`;

    const L = api.level, len = Math.min(3 + Math.floor(L / 2), 8);

    const showMs = Math.max(1100 + len * 300, 1700 + len * 480 - L * 110);
    stage.innerHTML = `<p class="hint">Order up! Remember the stack, <b>bottom to top</b>.</p><div class="ticket">${stackHTML(order, true)}<div class="memo"><i style="animation-duration:${showMs}ms"></i></div></div>`;
    api.later(build, showMs);
  }
  function build() {
    phase = 'build';

    stage.querySelectorAll('.ing').forEach(b => b.onclick = () => add(Number(b.dataset.i)));

    built.push(i);
    plate.innerHTML = stackHTML(built, false);
    plate.querySelector('.stack span').classList.add('drop');
    if (i !== order[built.length - 1]) {

      plate.querySelector('.stack').classList.add('topple');
      api.wrong(plate);

/* ============ MEMORY: Speed Match ============ */
const SM_EASY = ['🍎', '🚗', '⭐', '🐟', '🎈', '⚽', '🌙', '🎁'];

  }

    const nb = api.level >= 5 ? 2 : 1;

/* ============ FOCUS: Whack-a-Rule ============ */
const CRIT = ['🐭', '🐰', '🐹', '🐸', '🐧', '🦔'];
function whackGame(stage, api) {
  let rule, ruleAt = 0, spawnAcc = 0, last = null, elapsed = 0;
  stage.innerHTML = `<div class="rule" id="rule"></div><div class="holes">${range(9).map(i => `<button class="hole" aria-label="Hole ${i + 1}"><span class="pit"></span><span class="mask"><span class="critter"></span></span></button>`).join('')}</div><p class="hint">Hit the right critters. Wrong ones cost you your combo.</p>`;
  const ruleEl = stage.querySelector('#rule');

  holes.forEach(h => h.el.onpointerdown = e => { e.preventDefault(); hit(h); });
  function newRule(first) {
    const c = pick(CRIT), type = api.level >= 4 && Math.random() < .5 ? 'except' : 'only';
    rule = { type, c };
    ruleEl.innerHTML = type === 'only' ? `Whack only <span class="e">${c}</span>` : `Whack anything <u>but</u> <span class="e">${c}</span>`;
    if (!first) { ruleEl.classList.remove('flash'); void ruleEl.offsetWidth; ruleEl.classList.add('flash'); api.toast('New rule!'); SFX.level(); }
  }

  function hit(h) {

    h.el.classList.add('bonk');

    h.until = performance.now() + 200;
  }
  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min(.05, (ts - last) / 1000); last = ts; elapsed += dt;
    const L = api.level, now = performance.now();
    if (L >= 2 && elapsed - ruleAt > 9) { ruleAt = elapsed; newRule(false); }
    holes.forEach(h => {
      if (h.c && now > h.until) {
        if (!h.hit && isTarget(h.c)) api.miss(h.el);
        h.c = null; h.hit = false; h.el.classList.remove('up', 'bonk');
      }

    spawnAcc += dt;
    if (spawnAcc > Math.max(.36, .9 - L * .055)) {

        const h = pick(free), others = CRIT.filter(x => x !== rule.c), tgt = Math.random() < .55;
        h.c = rule.type === 'only' ? (tgt ? rule.c : pick(others)) : (tgt ? pick(others) : rule.c);
        h.hit = false; h.crit.textContent = h.c; h.el.classList.add('up');
        h.until = now + Math.max(650, 1500 - L * 85);

    api.raf(frame);
  }

  api.raf(frame);
}

function busGame(stage, api) {
  function round() {

      const off = rand(0, Math.min(on, maxMove)), onN = rand(off === 0 ? 1 : 0, maxMove);

    const askStops = L >= 5 && Math.random() < .35, answer = askStops ? S : on;
    stage.innerHTML = `<p class="hint">Passengers on the bus at the start</p><div class="onboard">${start}</div><div class="bscene"><span class="stopsign">🚏</span><span class="bus">🚌</span></div><p class="hint" id="bq">Keep track as people get on and off</p><div class="choices"></div>`;
    const scene = stage.querySelector('.bscene'), bus = scene.querySelector('.bus');
    const W = scene.clientWidth, busW = bus.getBoundingClientRect().width || 100;
    const bx = Math.max(W * .55 - busW / 2, 70), door = bx + busW * .45, sx = W * .1;
    const D = Math.round(650 * sp), ST = Math.round(280 * sp), WALK = Math.round(520 * sp);
    bus.style.transform = `translateX(${W + 20}px)`;
    function walker(from, to, fade) {

      p.style.transform = `translateX(${from}px)`;
      scene.append(p);
      api.raf(() => api.raf(() => { p.style.transition = `transform ${WALK}ms ease-in-out, opacity ${WALK}ms ease-in`; p.style.transform = `translateX(${to}px)`; if (fade) p.style.opacity = 0; }));
      api.later(() => p.remove(), WALK + 80);
    }
    let t = 500;
    stops.forEach(s => {
      api.later(() => { bus.style.transition = `transform ${D}ms cubic-bezier(.25,1.15,.5,1)`; bus.style.transform = `translateX(${bx}px)`; }, t);
      t += D + 150;
      for (let i = 0; i < s.off; i++) { api.later(() => walker(door, -60, false), t); t += ST; }
      if (s.off) t += 200;
      for (let i = 0; i < s.on; i++) { api.later(() => walker(sx, door, true), t); t += ST; }
      t += WALK;
      api.later(() => { bus.style.transition = `transform ${D}ms cubic-bezier(.55,0,.8,.2)`; bus.style.transform = `translateX(${-busW - 30}px)`; SFX.whoosh(); }, t);
      t += D + 60;
      api.later(() => { bus.style.transition = 'none'; bus.style.transform = `translateX(${W + 20}px)`; }, t);
      t += 40;
    });
    api.later(() => {
      stage.querySelector('#bq').innerHTML = askStops ? 'Trick question! How many <b>stops</b> did the bus make?' : 'How many passengers are on the bus <b>now</b>?';
      const opts = aroundInts(answer);
      const btns = choiceRow(stage.querySelector('.choices'), opts.map(v => ({ html: String(v) })), i => judge(api, btns, i, opts.indexOf(answer), round, 60 + L * 10), 4);
      api.onKey = keyPick(btns);
    }, t + 200);
  }
  round();
}

/* ---------- stress mode distractions ---------- */
function startBugs(wrap) {
  const layer = document.createElement('div');
  layer.className = 'bugs';
  wrap.append(layer);
  const W = () => wrap.clientWidth - 30, H = () => wrap.clientHeight - 30;
  const bugs = ['🪳', '🐜', '🪲', '🕷️', '🐜'].map(e => {
    const el = document.createElement('span');
    el.className = 'bug'; el.textContent = e; layer.append(el);
    return { el, x: Math.random() * W(), y: Math.random() * H(), a: Math.random() * 6.28, v: 50 + Math.random() * 60 };
  });
  let last = performance.now(), id, shakeT;
  const loop = ts => {
    const dt = Math.min(.05, (ts - last) / 1000); last = ts;
    bugs.forEach(b => {
      b.a += (Math.random() - .5) * 10 * dt;
      b.x += Math.cos(b.a) * b.v * dt; b.y += Math.sin(b.a) * b.v * dt;
      if (b.x < 0 || b.x > W()) { b.a = Math.PI - b.a; b.x = Math.max(0, Math.min(W(), b.x)); }
      if (b.y < 0 || b.y > H()) { b.a = -b.a; b.y = Math.max(0, Math.min(H(), b.y)); }
      b.el.style.transform = `translate(${b.x}px,${b.y}px) rotate(${b.a + Math.PI / 2}rad)`;
    });
    id = requestAnimationFrame(loop);
  };
  id = requestAnimationFrame(loop);
  const shake = () => { wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake'); shakeT = setTimeout(shake, 4000 + Math.random() * 4000); };
  shakeT = setTimeout(shake, 2500);
  return () => { cancelAnimationFrame(id); clearTimeout(shakeT); layer.remove(); wrap.classList.remove('shake'); };
}

/* ---------- catalogue ---------- */
const CATS = [
  { id: 'logic', name: 'Logic', weak: 'Logic tripped you up. Before you tap, trace the water path or the scale clues all the way through once.' },
  { id: 'math', name: 'Math', weak: 'Math was your weak spot. Break totals into round numbers first, like 350 + 280 is 600 + 30.' },
  { id: 'memory', name: 'Memory', weak: 'Memory let you down. Say the order to yourself while you look, like "cheese, patty, tomato".' },
  { id: 'visual', name: 'Visual', weak: 'Visual cost you points. Scan the shelf row by row instead of all at once.' },
  { id: 'focus', name: 'Focus', weak: 'Focus slipped. Read the rule again every time it changes, and count out loud with the bus.' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const GAMES = [
  { id: 'pipes', cat: 'logic', name: 'Pipe Flow', icon: '🚰', par: 3, create: pipesGame,
    blurb: 'Turn the pipes, water the plant.',
    how: 'Tap a pipe to turn it. Connect a path from the tap on the left to the plant on the right. Water fills the pipes as they connect. Bigger grids and longer routes as you level up.' },
  { id: 'scales', cat: 'logic', name: 'Fruit Scales', icon: '⚖️', par: 7, create: scalesGame,
    blurb: 'Read the scales, find the heaviest.',
    how: 'Each scale tips toward the heavier side, or stays level if both sides weigh the same. Put all the clues together and pick the heaviest fruit. Later rounds pile several fruits on one pan.' },
  { id: 'bubbles', cat: 'math', name: 'Bubble Sum', icon: '🫧', par: 8, create: bubbleGame, lvlEvery: 3,
    blurb: 'Pop bubbles that hit the target.',
    how: 'Numbered bubbles float up. Tap bubbles that add up to the target exactly. Go over and they all burst. Tap a picked bubble to let it go.' },
  { id: 'shop', cat: 'math', name: 'Shop Till', icon: '🛒', par: 7, create: shopGame,
    blurb: 'Give customers the right change.',
    how: 'A customer pays with a note. Tap notes to hand back the exact change. Give too much and they get angry. From level 4 the total is hidden, so you add up the prices yourself.' },
  { id: 'burger', cat: 'memory', name: 'Burger Bar', icon: '🍔', par: 5, create: burgerGame,
    blurb: 'Remember the order, build the burger.',
    how: 'An order shows a burger for a few seconds. When it disappears, build it from the bottom up by tapping ingredients in the right order. Orders get taller as you level up.' },
  { id: 'speed', cat: 'memory', name: 'Speed Match', icon: '🃏', par: 25, create: speedGame, lvlEvery: 5,
    blurb: 'Same as the last card? Quick!',
    how: 'Cards come one after another. Say whether each card matches the one before it. From level 6 it switches to matching the card two back. Arrow keys work too.' },
  { id: 'shadow', cat: 'visual', name: 'Shadow Snap', icon: '👤', par: 18, create: silGame, lvlEvery: 4,
    blurb: 'Whose silhouette is it?',
    how: 'A black silhouette appears. Pick which picture it belongs to, fast. Answers under 1.5 seconds score extra. Higher levels flip and turn the shadow, and use animals that look alike.' },
  { id: 'shelf', cat: 'visual', name: 'Shelf Swap', icon: '🏪', par: 7, create: shelfGame,
    blurb: 'Lights out. What changed?',
    how: 'Memorise the shop shelf. The lights go out and one item gets swapped. Tap the one that changed. At higher levels the shelf is bigger and the swap is sneakier.' },
  { id: 'whack', cat: 'focus', name: 'Whack-a-Rule', icon: '🔨', par: 22, create: whackGame, lvlEvery: 5,
    blurb: 'Whack the right ones. Rules change.',
    how: 'Critters pop out of holes. Whack only the ones the rule allows. From level 3 the rule changes every few seconds, and from level 5 it can flip to "anything but".' },
  { id: 'bus', cat: 'focus', name: 'Bus Stop', icon: '🚌', par: 3, create: busGame,
    blurb: 'Count who gets on and off.',
    how: 'The bus stops again and again. People get off, people get on. Keep count, then answer the question at the end. Sometimes it is a trick question.' }
];
const BY = Object.fromEntries(GAMES.map(g => [g.id, g]));
const GAME_TIME = 45;
const DIFF_LEVEL = [0, 4, 7];

/* ---------- screens ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id); window.scrollTo(0, 0); }
function setCat(cat) {
  const r = document.documentElement.style;
  if (cat) { r.setProperty('--cat', `var(--${cat})`); r.setProperty('--cat-soft', `var(--${cat}-soft)`); r.setProperty('--on-cat', cat === 'focus' ? 'var(--ink)' : '#fff'); }
  else ['--cat', '--cat-soft', '--on-cat'].forEach(p => r.removeProperty(p));
}

function chartSVG(vals) {
  const w = 320, h = 100, px = 24, py = 10;
  const x = i => px + (vals.length === 1 ? 0 : i * (w - px - 10) / (vals.length - 1));
  const y = v => h - py - (v / 100) * (h - 2 * py);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Brain usage over your last ${vals.length} tests">
    ${[0, 50, 100].map(g => `<line class="gl" x1="${px}" x2="${w - 4}" y1="${y(g)}" y2="${y(g)}"/><text class="lb" x="0" y="${y(g) + 3}">${g}%</text>`).join('')}
    <polygon class="ar" points="${x(0)},${y(0)} ${pts} ${x(vals.length - 1)},${y(0)}"/>
    <polyline class="ln" points="${pts}"/>
    <circle class="pt" cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="5.5"/></svg>`;
}

function renderHome() {
  setCat(null);
  const tests = store.history.filter(x => x.mode === 'test'), stress = store.history.filter(x => x.mode === 'stress');
  const s = [];
  if (tests.length) s.push(`<div class="stat"><b>${tests[tests.length - 1].index}%</b><small>Last brain test</small></div>`, `<div class="stat"><b>${Math.max(...tests.map(x => x.index))}%</b><small>Best</small></div>`);
  if (stress.length) s.push(`<div class="stat"><b>${Math.max(...stress.map(x => x.index))}%</b><small>Best under stress</small></div>`);
  $('#homeStats').innerHTML = s.join('');
  const ch = $('#homeChart');
  if (tests.length >= 2) { const v = tests.slice(-14).map(x => x.index); ch.innerHTML = `<span class="label" style="font-size:18px">Brain chart</span>${chartSVG(v)}`; ch.hidden = false; }
  else ch.hidden = true;

  const list = $('#trainList');
  list.innerHTML = '';
  GAMES.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gcard';
    b.style.setProperty('--cat', `var(--${g.cat})`);
    b.style.setProperty('--cat-soft', `var(--${g.cat}-soft)`);
    const bs = store.best[g.id];
    b.innerHTML = `<span class="ic" aria-hidden="true">${g.icon}</span><span class="t"><strong>${g.name}</strong><small>${g.blurb}</small><span class="best">${CAT[g.cat].name}${bs != null ? ` · best ${bs}` : ''}</span></span>`;
    b.onclick = () => { session = { mode: 'train', order: [g.id], i: 0, scores: {} }; intro(); };
    list.append(b);
  });
  show('home');
}

let session = null;   // { mode: 'test'|'stress'|'train', order, i, scores }
let cur = null;       // the running game

function intro() {
  const g = BY[session.order[session.i]];
  setCat(g.cat);
  $('#introIcon').textContent = g.icon;
  $('#introChip').textContent = CAT[g.cat].name;
  $('#introName').textContent = g.name;
  $('#introHow').textContent = g.how;
  const train = session.mode === 'train';
  $('#diffSeg').hidden = !train;
  const paint = () => $('#diffSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.d) === store.diff)));
  $('#diffSeg').querySelectorAll('button').forEach(b => b.onclick = () => { store.diff = Number(b.dataset.d); save(store); paint(); SFX.tap(); });
  paint();
  $('#introMeta').textContent = train
    ? `${GAME_TIME} seconds · fixed difficulty`
    : `${session.mode === 'stress' ? 'Stress test' : 'Brain test'} · game ${session.i + 1} of ${session.order.length} · ${GAME_TIME} seconds`;
  $('#introGo').onclick = () => { audio(); play(); };
  show('intro');
  $('#introGo').focus({ preventScroll: true });
}

function play() {
  const g = BY[session.order[session.i]];
  const adaptive = session.mode !== 'train';
  const stage = $('#stage'), wrap = $('#wrap');
  stage.innerHTML = '';
  $('#playChip').textContent = CAT[g.cat].name;
  $('#playName').textContent = g.name;
  $('#playScore').textContent = '0';
  $('#combo').className = 'combo';
  $('#timeFill').style.transform = 'scaleX(1)';
  $('#timeLeft').textContent = GAME_TIME;
  $('#timer').classList.remove('hurry');
  $('#hudMascot').innerHTML = mascotSVG();

  const stats = { correct: 0, wrong: 0, points: 0, streak: 0, bestStreak: 0 };
  const run = { g, stats, live: false, timers: new Set(), rafs: new Set(), frame: 0, unbug: null };
  cur = run;
  let prog = 0;
  const lvlText = () => { $('#playLevel').textContent = `Level ${api.level + 1}`; };
  const flash = ok => {
    wrap.classList.remove('ok', 'no'); void wrap.offsetWidth; wrap.classList.add(ok ? 'ok' : 'no');
    if (!ok) { wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake'); }
    const t = setTimeout(() => wrap.classList.remove('ok', 'no'), 260); run.timers.add(t);
  };
  const paintScore = bump => {
    const sc = $('#playScore');
    sc.textContent = stats.points;
    if (bump) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
    const m = mult(), cb = $('#combo');
    cb.textContent = `×${m} combo`;
    cb.className = 'combo';
    if (m > 1) { void cb.offsetWidth; cb.className = 'combo on'; }
  };
  const mult = () => Math.min(5, 1 + Math.floor(stats.streak / 3));
  const api = {
    stats,
    level: adaptive ? 2 : DIFF_LEVEL[store.diff],
    onKey: null,
    live: () => cur === run && run.live,
    right(base, at) {
      if (!api.live()) return;
      stats.correct++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
      const pts = Math.round(base * mult());
      stats.points += pts;
      const p = centerOf(at);
      floatText(p, `+${pts}`); burst(p);
      SFX.good(stats.streak);
      mood('#hudMascot', stats.streak >= 3 ? 'happy' : 'wow', 600);
      flash(true); paintScore(true);
      if (adaptive && ++prog >= (g.lvlEvery || 2) && api.level < 9) { prog = 0; api.level++; api.toast(`Level ${api.level + 1}!`); api.later(SFX.level, 120); }
      lvlText();
    },
    wrong(at) {
      if (!api.live()) return;
      stats.wrong++; stats.streak = 0; prog = 0;
      floatText(centerOf(at), '✗', 'bad');
      SFX.bad(); mood('#hudMascot', 'sad', 800);
      flash(false); paintScore(false);
      if (adaptive) api.level = Math.max(0, api.level - 1);
      lvlText();
    },
    miss(at) {
      if (!api.live() || !stats.streak) return;
      stats.streak = 0; paintScore(false);
      floatText(centerOf(at), 'missed', 'small');
    },
    toast(text) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = text;
      stage.append(t); setTimeout(() => t.remove(), 1450);
    },
    later(fn, ms) { const t = setTimeout(() => { run.timers.delete(t); if (api.live()) fn(); }, ms); run.timers.add(t); return t; },
    raf(fn) { const id = requestAnimationFrame(ts => { run.rafs.delete(id); if (api.live()) fn(ts); }); run.rafs.add(id); return id; }
  };
  run.api = api;
  lvlText();
  show('play');

  let n = 3;
  const countdown = () => {
    if (cur !== run) return;
    if (n === 0) { stage.innerHTML = '<div class="count">GO!</div>'; SFX.go(); const t = setTimeout(begin, 450); run.timers.add(t); return; }
    stage.innerHTML = `<div class="count">${n--}</div>`;
    SFX.count();
    const t = setTimeout(countdown, 600); run.timers.add(t);
  };
  countdown();

  function begin() {
    if (cur !== run) return;
    stage.innerHTML = '';
    run.live = true;
    if (session.mode === 'stress') run.unbug = startBugs(wrap);
    g.create(stage, api);
    const start = performance.now();
    let lastSec = GAME_TIME;
    const frame = () => {
      if (!api.live()) return;
      const left = GAME_TIME - (performance.now() - start) / 1000, sec = Math.max(0, Math.ceil(left));
      $('#timeFill').style.transform = `scaleX(${Math.max(0, left / GAME_TIME)})`;
      if (sec !== lastSec) {
        lastSec = sec; $('#timeLeft').textContent = sec;
        if (sec <= 5 && sec > 0) { $('#timer').classList.add('hurry'); SFX.tick(); }
      }
      if (left <= 0) finish();
      else run.frame = requestAnimationFrame(frame);
    };
    run.frame = requestAnimationFrame(frame);
  }
}

function stop() {
  if (!cur) return;
  cur.live = false;
  cancelAnimationFrame(cur.frame);
  cur.timers.forEach(clearTimeout);
  cur.rafs.forEach(cancelAnimationFrame);
  if (cur.unbug) cur.unbug();
  $('#wrap').classList.remove('ok', 'no', 'shake');
  $('#timer').classList.remove('hurry');
}

function countUp(el, to, ms = 900) {
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function finish() {
  const { g, stats } = cur;
  stop();
  cur = null;
  const rating = clamp(100 * (stats.correct - 0.5 * stats.wrong) / g.par);
  const stars = rating >= 85 ? 3 : rating >= 60 ? 2 : rating >= 30 ? 1 : 0;
  const prev = store.best[g.id];
  const isBest = stats.points > 0 && (prev == null || stats.points > prev);
  if (isBest) store.best[g.id] = stats.points;
  save(store);

  $('#resChip').textContent = CAT[g.cat].name;
  $('#resName').textContent = g.name;
  $('#resStars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${.15 + i * .18}s">⭐</span>`).join('');
  countUp($('#resScore'), stats.points);
  $('#resMeta').textContent = `${stats.correct} right · ${stats.wrong} wrong · best streak ${stats.bestStreak}` + (prev != null && !isBest ? ` · your best is ${prev}` : '');
  $('#resBest').hidden = !(isBest && prev != null);
  if (stars >= 2 || (isBest && prev != null)) { SFX.win(); confetti(stars === 3 ? 140 : 80); }
  else SFX.level();

  session.scores[g.cat] = { score: rating, game: g.id };
  session.i++;
  if (session.mode === 'train') {
    $('#resNext').textContent = 'Play again';
    $('#resNext').onclick = () => { session.i = 0; intro(); };
  } else {
    const done = session.i >= session.order.length;
    $('#resNext').textContent = done ? 'See my brain usage' : `Next: ${BY[session.order[session.i]].name}`;
    $('#resNext').onclick = () => done ? final() : intro();
  }
  show('result');
  $('#resNext').focus({ preventScroll: true });
}

function verdict(i) {
  if (i >= 90) return 'Genius mode. Nothing got past you.';
  if (i >= 75) return 'Sharp! Strong across the board.';
  if (i >= 60) return 'Warmed up and firing.';
  if (i >= 40) return 'Getting there. A couple of areas held you back.';
  return 'Slow start. Shake it off and go again.';
}

function final() {
  setCat(null);
  const mode = session.mode, sc = session.scores;
  const val = c => sc[c.id] ? sc[c.id].score : 0;
  const index = Math.round(CATS.reduce((t, c) => t + val(c), 0) / CATS.length);
  const same = store.history.filter(x => x.mode === mode);
  const prevBest = same.length ? Math.max(...same.map(x => x.index)) : null;
  store.history.push({ t: Date.now(), mode, index, scores: Object.fromEntries(CATS.map(c => [c.id, val(c)])) });
  store.history = store.history.slice(-60);
  save(store);

  $('#finLabel').textContent = mode === 'stress' ? 'Brain usage under stress' : 'Brain usage';
  countUp($('#finIndex'), index, 1200);
  $('#finVerdict').textContent = verdict(index);
  $('#finMeta').textContent = prevBest == null ? 'First result saved. Next time you will see if you beat it.' : index > prevBest ? `New record! Your previous best was ${prevBest}%.` : `Your best is ${prevBest}%.`;
  $('#finBars').innerHTML = CATS.map(c => `
    <div class="bar" style="--cat:var(--${c.id})">
      <span>${c.name}<small>${sc[c.id] ? BY[sc[c.id].game].name : ''}</small></span>
      <div class="track"><div class="fill" style="transform:scaleX(${val(c) / 100})"></div></div>
      <b>${val(c)}</b>
    </div>`).join('');
  const ranked = [...CATS].sort((a, b) => val(b) - val(a));
  $('#finCoach').innerHTML = `<div id="coachMascot">${mascotSVG()}</div><div><p>Your strongest area today was <b>${ranked[0].name.toLowerCase()}</b>.</p><p>${ranked[ranked.length - 1].weak}</p></div>`;
  mood('#coachMascot', index >= 60 ? 'happy' : index >= 40 ? 'idle' : 'sad', 0);
  if (index >= 60 || (prevBest != null && index > prevBest)) { SFX.win(); confetti(140); }
  $('#finAgain').onclick = () => startTest(mode);
  show('final');
}

function startTest(mode) {
  audio();
  session = { mode, order: CATS.map(c => pick(GAMES.filter(g => g.cat === c.id)).id), i: 0, scores: {} };
  intro();
}

function start() {
  $('#homeMascot').innerHTML = mascotSVG();
  $('#startTest').onclick = () => startTest('test');
  $('#startStress').onclick = () => startTest('stress');
  $('#introBack').onclick = () => { session = null; renderHome(); };
  $('#resHome').onclick = () => { session = null; renderHome(); };
  $('#finHome').onclick = renderHome;
  $('#quit').onclick = () => { stop(); cur = null; session = null; renderHome(); };
  $('#muteHome').onclick = toggleMute;
  $('#mutePlay').onclick = toggleMute;
  $('#homeMascot').onclick = () => { audio(); SFX.good(4); mood('#homeMascot', 'happy', 900); };
  paintMute();
  document.addEventListener('keydown', e => {
    if (cur && cur.live && cur.api.onKey && cur.api.onKey(e)) e.preventDefault();
  });
  renderHome();
  setTimeout(() => mood('#homeMascot', 'happy', 1000), 400);
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
